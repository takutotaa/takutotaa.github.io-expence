<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f8fb"><title>収支計算</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c2738;background:#f7f8fb}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b4c9fc;outline-offset:2px}.wrap{max-width:1120px;margin:0 auto;padding:36px 22px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:27px}.eyebrow{color:#8793a6;font-size:11px;letter-spacing:.18em;font-weight:800}h1{font-size:27px;letter-spacing:-.04em;margin:7px 0 0}h2{font-size:17px;margin:0}p{margin:0}.btn{border:1px solid #e0e5ed;background:white;border-radius:11px;padding:10px 14px;color:#34445b;font-weight:650}.btn:hover{background:#f2f5fa}.btn.primary{background:#253c64;border-color:#253c64;color:white}.btn.primary:hover{background:#344e7a}.btn.danger{color:#b54c53}.summary{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:14px;margin-bottom:22px}.stat{background:white;border:1px solid #e7eaf0;border-radius:17px;padding:20px 22px;box-shadow:0 8px 30px #25334c08}.stat span{color:#8b95a4;font-size:12px;font-weight:650}.stat strong{display:block;font-size:26px;letter-spacing:-.05em;margin-top:8px;font-variant-numeric:tabular-nums}.stat.balance{background:#253c64;border-color:#253c64;color:white}.stat.balance span{color:#bfcbe0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;border:1px solid #e7eaf0;border-radius:18px;padding:22px;min-width:0;box-shadow:0 8px 30px #25334c08}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.pill{font-size:11px;background:#e8f5ee;color:#35805d;padding:5px 9px;border-radius:20px}.pill.expense{background:#fff0ed;color:#b5685b}.entries{min-height:120px}.entry{display:grid;grid-template-columns:minmax(0,1fr) 140px 30px;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #eef0f4}.entry .name{font-weight:650;overflow-wrap:anywhere}.entry input{width:100%;text-align:right;border:1px solid #e0e5ed;border-radius:9px;padding:9px 10px;min-width:0}.icon-btn{border:0;background:transparent;color:#a3adbb;font-size:21px;line-height:1;padding:5px}.icon-btn:hover{color:#ba5454}.empty{color:#9ca5b3;text-align:center;padding:37px 8px;font-size:13px}.add-row{margin-top:17px;position:relative}.add-row label{display:block;font-size:12px;color:#7c899a;margin-bottom:8px}.search{width:100%;border:1px solid #dce2eb;border-radius:11px;padding:12px 13px;background:#fbfcfe}.suggestions{position:absolute;z-index:5;top:100%;left:0;right:0;background:white;border:1px solid #e0e5ed;border-radius:12px;margin-top:5px;box-shadow:0 15px 30px #1b2b4422;max-height:230px;overflow:auto;display:none}.suggestions.open{display:block}.suggestion{display:flex;justify-content:space-between;width:100%;border:0;background:white;padding:12px 14px;text-align:left}.suggestion:hover{background:#f3f6fb}.suggestion small{color:#8996a7}.suggestion-empty{padding:13px;color:#8d98a9;font-size:13px}.foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eef0f4;margin-top:18px;padding-top:18px;font-weight:700}.foot strong{font-size:20px;font-variant-numeric:tabular-nums}.hint{font-size:12px;color:#97a2b0;margin-top:18px;text-align:center}.modal-backdrop{position:fixed;inset:0;background:#18253b80;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.show{display:flex}.modal{width:min(100%,650px);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:26px;box-shadow:0 30px 80px #13213b40}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.form{display:grid;grid-template-columns:145px 1fr auto;gap:10px;margin-bottom:24px}.form input,.form select{border:1px solid #dce2eb;border-radius:10px;padding:11px;min-width:0;background:#fff}.master-group{margin-top:18px}.master-title{font-size:12px;font-weight:800;color:#8793a4;margin-bottom:9px}.master-item{display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:1px solid #edf0f4;padding:11px 0}.master-actions{display:flex;gap:5px}.master-actions button{font-size:12px;padding:6px 10px}.muted{color:#9aa5b4;font-size:12px}.footer-actions{display:flex;justify-content:space-between;align-items:center;margin-top:25px;gap:10px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#253c64;color:white;border-radius:10px;padding:12px 18px;font-size:13px;display:none;z-index:30}.toast.show{display:block}@media(max-width:720px){.wrap{padding:22px 13px 60px}.top{align-items:flex-start}h1{font-size:23px}.summary{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:15px}.stat strong{font-size:21px}.stat.balance{grid-column:1/-1;grid-row:1}.columns{grid-template-columns:1fr;gap:13px}.panel{padding:17px}.entry{grid-template-columns:minmax(0,1fr) 125px 26px}.modal{padding:18px}.form{grid-template-columns:1fr 1fr}.form input{grid-column:1/-1}.form button{grid-column:1/-1}.footer-actions{flex-wrap:wrap}}

/* Mobile-first refinements */
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{overflow-x:hidden}input,select,button{touch-action:manipulation}button{min-height:42px}.mobile-tabs{display:none}.entry input{font-variant-numeric:tabular-nums}.stat strong,.foot strong{overflow-wrap:anywhere}.modal-open{overflow:hidden}
@media(max-width:720px){
 .wrap{padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(48px + env(safe-area-inset-bottom,0px));max-width:560px}
 .top{align-items:center;gap:8px;margin-bottom:20px}.top .btn{white-space:nowrap;padding:10px 12px;font-size:13px}h1{font-size:25px}.eyebrow{font-size:10px}
 .summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}.stat{padding:16px;border-radius:15px;min-width:0}.stat strong{font-size:clamp(17px,4.7vw,23px)}.stat.balance{grid-column:1/-1;grid-row:1;padding:21px 19px}.stat.balance strong{font-size:clamp(28px,8vw,36px)}
 .mobile-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#e9edf4;padding:4px;border-radius:13px;margin-bottom:12px}.mobile-tab{background:transparent;border:0;border-radius:10px;font-weight:750;color:#7d8a9c;min-height:44px}.mobile-tab.active{background:white;color:#263d63;box-shadow:0 2px 9px #1b2b4414}
 .columns{display:block}.columns .panel{display:none}.columns[data-active="income"] .panel[data-panel="income"],.columns[data-active="expense"] .panel[data-panel="expense"]{display:block}.panel{padding:17px 16px 20px;border-radius:16px}.panel-head{margin-bottom:10px}.panel-head h2{font-size:16px}
 .entry{grid-template-columns:minmax(0,1fr) minmax(112px,43%) 34px;gap:6px;padding:11px 0}.entry .name{font-size:14px}.entry input{font-size:16px;padding:11px 8px}.icon-btn{min-width:34px;min-height:44px}.search{font-size:16px;min-height:48px}.suggestion{min-height:48px;align-items:center}.foot{margin-top:16px}.foot strong{font-size:21px}.hint{line-height:1.7;margin-top:20px}
 .modal-backdrop{align-items:flex-end;padding:0}.modal{width:100%;max-width:none;max-height:calc(100dvh - 20px);border-radius:22px 22px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}.modal-head{margin-bottom:17px}.modal-head h2{font-size:19px}.form{grid-template-columns:1fr;gap:10px}.form input,.form select{grid-column:auto;font-size:16px;min-height:48px}.form button{grid-column:auto;min-height:48px}.master-item{gap:8px}.master-item>span{min-width:0;overflow-wrap:anywhere;font-size:14px}.master-actions{flex-shrink:0}.master-actions button{min-height:42px}.footer-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footer-actions button{font-size:12px;padding:10px 6px;white-space:nowrap}.toast{bottom:calc(22px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 32px);width:max-content;text-align:center}
}
@media(max-width:360px){.wrap{padding-left:11px;padding-right:11px}.stat{padding:13px}.panel{padding-left:12px;padding-right:12px}.entry{grid-template-columns:minmax(0,1fr) 108px 28px}.entry .name{font-size:13px}.entry input{padding:10px 6px}}
@media(min-width:721px) and (max-width:900px){.wrap{padding:28px 18px 60px}.entry{grid-template-columns:minmax(0,1fr) 115px 30px}.panel{padding:17px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">INCOME & EXPENSE</div><h1>収支計算</h1></div><button id="manageBtn" class="btn">科目管理</button></header><section class="summary" aria-label="集計"><div class="stat"><span>収益合計</span><strong id="incomeTotal">¥0</strong></div><div class="stat"><span>費用合計</span><strong id="expenseTotal">¥0</strong></div><div class="stat balance"><span>収支合計</span><strong id="balance">¥0</strong></div></section><nav class="mobile-tabs" aria-label="収支の切り替え"><button type="button" class="mobile-tab active" data-tab="income" aria-pressed="true">収益</button><button type="button" class="mobile-tab" data-tab="expense" aria-pressed="false">費用</button></nav><section class="columns" id="entryColumns"><article class="panel" data-panel="income"><div class="panel-head"><h2>収益</h2></div><div id="incomeEntries" class="entries"></div><div class="add-row"><label for="incomeSearch">収益科目を追加</label><input id="incomeSearch" class="search" placeholder="科目名を検索・選択" autocomplete="off"><div id="incomeSuggestions" class="suggestions"></div></div><div class="foot"><span>合計</span><strong id="incomeFoot">¥0</strong></div></article><article class="panel" data-panel="expense"><div class="panel-head"><h2>費用</h2></div><div id="expenseEntries" class="entries"></div><div class="add-row"><label for="expenseSearch">費用科目を追加</label><input id="expenseSearch" class="search" placeholder="科目名を検索・選択" autocomplete="off"><div id="expenseSuggestions" class="suggestions"></div></div><div class="foot"><span>合計</span><strong id="expenseFoot">¥0</strong></div></article></section><p class="hint">入力内容はこのブラウザに自動保存されます。サーバーへの送信は行いません。</p></main><div id="modalBackdrop" class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">科目管理</h2><button class="icon-btn" id="closeModal" aria-label="閉じる">×</button></div><form id="masterForm" class="form"><select id="masterType" aria-label="区分"><option value="income">収益</option><option value="expense">費用</option></select><input id="masterName" maxlength="60" required placeholder="新しい科目名を入力" aria-label="科目名"><button class="btn primary" type="submit">＋ 科目を登録</button></form><div id="masterList"></div></section></div><div id="toast" class="toast" role="status"></div><script>
(()=>{'use strict';const KEY='income-expense-production-v1';const initial=()=>({masters:[],entries:[]});const $=id=>document.getElementById(id);const money=n=>(n<0?'−':'')+'¥'+Math.abs(n).toLocaleString('ja-JP');const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();let state;let toastTimer;function validate(x){if(!x||!Array.isArray(x.masters)||!Array.isArray(x.entries)||x.masters.length>1000||x.entries.length>5000)throw Error('データ形式が不正です');const ids=new Set();for(const m of x.masters){if(typeof m.id!=='string'||ids.has(m.id)||!['income','expense'].includes(m.type)||typeof m.name!=='string'||!m.name.trim()||m.name.length>60||typeof m.active!=='boolean')throw Error('科目データが不正です');ids.add(m.id)}const entryIds=new Set();for(const e of x.entries){if(typeof e.id!=='string'||entryIds.has(e.id)||!ids.has(e.masterId)||typeof e.amount!=='number'||!Number.isSafeInteger(e.amount)||e.amount<0||e.amount>999999999999)throw Error('明細データが不正です');entryIds.add(e.id)}return x}try{const saved=localStorage.getItem(KEY);state=saved?validate(JSON.parse(saved)):initial()}catch(e){state=initial();alert('保存データを読み込めませんでした。空の状態で表示します。')}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('保存できませんでした。ブラウザの空き容量を確認してください。')}}function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}function make(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el}function render(){for(const type of ['income','expense']){const box=$(type+'Entries');box.replaceChildren();const rows=state.entries.filter(e=>state.masters.find(m=>m.id===e.masterId)?.type===type);if(!rows.length)box.append(make('div','empty','科目が追加されていません'));for(const e of rows){const m=state.masters.find(x=>x.id===e.masterId);const row=make('div','entry');row.append(make('div','name',m.name));const input=make('input');input.type='number';input.min='0';input.max='999999999999';input.step='1';input.inputMode='numeric';input.value=e.amount;input.setAttribute('aria-label',m.name+'の金額');input.addEventListener('input',()=>{if(input.value==='')return;const n=Number(input.value);if(!Number.isSafeInteger(n)||n<0||n>999999999999){input.setCustomValidity('0以上の整数で入力してください');return}input.setCustomValidity('');e.amount=n;save();renderTotals()});input.addEventListener('blur',()=>{if(input.value===''||!input.checkValidity()){input.value=e.amount;input.setCustomValidity('')}});row.append(input);const del=make('button','icon-btn','×');del.type='button';del.title='この科目を計算から削除';del.addEventListener('click',()=>{state.entries=state.entries.filter(x=>x.id!==e.id);save();render()});row.append(del);box.append(row)}}renderTotals();renderMasters();for(const type of ['income','expense'])renderSuggestions(type)}function renderTotals(){const sum=type=>state.entries.reduce((a,e)=>{const m=state.masters.find(x=>x.id===e.masterId);return a+(m?.type===type?e.amount:0)},0);const i=sum('income'),e=sum('expense');$('incomeTotal').textContent=money(i);$('expenseTotal').textContent=money(e);$('incomeFoot').textContent=money(i);$('expenseFoot').textContent=money(e);$('balance').textContent=money(i-e)}function renderSuggestions(type){const input=$(type+'Search'),box=$(type+'Suggestions'),q=input.value.trim().toLocaleLowerCase();box.replaceChildren();const choices=state.masters.filter(m=>m.active&&m.type===type&&m.name.toLocaleLowerCase().includes(q)&&!state.entries.some(e=>e.masterId===m.id));if(!choices.length)box.append(make('div','suggestion-empty','該当する科目がありません。科目管理から登録してください。'));for(const m of choices){const btn=make('button','suggestion');btn.type='button';btn.append(make('span','',m.name),make('small','','＋ 追加'));btn.addEventListener('mousedown',e=>e.preventDefault());btn.addEventListener('click',()=>{state.entries.push({id:uid(),masterId:m.id,amount:0});input.value='';box.classList.remove('open');save();render();const added=[...$(type+'Entries').querySelectorAll('input')].at(-1);added?.focus();added?.select()});box.append(btn)}}for(const type of ['income','expense']){const input=$(type+'Search'),box=$(type+'Suggestions');input.addEventListener('focus',()=>{renderSuggestions(type);box.classList.add('open')});input.addEventListener('input',()=>{renderSuggestions(type);box.classList.add('open')});input.addEventListener('keydown',e=>{if(e.key==='Escape')box.classList.remove('open');if(e.key==='Enter'){e.preventDefault();box.querySelector('button')?.click()}});input.addEventListener('blur',()=>setTimeout(()=>box.classList.remove('open'),150))}function renderMasters(){const root=$('masterList');root.replaceChildren();for(const type of ['income','expense']){const group=make('div','master-group');group.append(make('div','master-title',type==='income'?'収益科目':'費用科目'));const masters=state.masters.filter(m=>m.type===type&&m.active);if(!masters.length)group.append(make('div','muted','科目がありません'));for(const m of masters){const item=make('div','master-item');item.append(make('span','',m.name));const actions=make('div','master-actions');const edit=make('button','btn','編集');edit.type='button';edit.addEventListener('click',()=>{const name=prompt('科目名を変更',m.name);if(name===null)return;const trimmed=name.trim();if(!trimmed||trimmed.length>60){toast('科目名は1～60文字で入力してください');return}if(state.masters.some(x=>x.active&&x.type===type&&x.id!==m.id&&x.name===trimmed)){toast('同じ区分に同名の科目があります');return}m.name=trimmed;save();render()});const del=make('button','btn danger','削除');del.type='button';del.addEventListener('click',()=>{const used=state.entries.some(e=>e.masterId===m.id);if(!confirm(used?'この科目を非表示にします。現在の収支明細は保持されます。よろしいですか？':'この科目を削除しますか？'))return;m.active=false;save();render()});actions.append(edit,del);item.append(actions);group.append(item)}root.append(group)}}$('masterForm').addEventListener('submit',e=>{e.preventDefault();const type=$('masterType').value,name=$('masterName').value.trim();if(!name)return;if(state.masters.some(m=>m.active&&m.type===type&&m.name===name)){toast('同じ科目がすでに登録されています');return}state.masters.push({id:uid(),type,name,active:true});$('masterName').value='';save();render();toast('科目を登録しました')});const modal=$('modalBackdrop');function close(){modal.classList.remove('show');document.body.classList.remove('modal-open')}$('manageBtn').addEventListener('click',()=>{modal.classList.add('show');document.body.classList.add('modal-open');$('masterName').focus()});$('closeModal').addEventListener('click',close);modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.querySelectorAll('.mobile-tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.mobile-tab').forEach(b=>{const active=b===btn;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});$('entryColumns').dataset.active=btn.dataset.tab;document.activeElement?.blur?.()}));$('entryColumns').dataset.active='income';render()})();
</script></body></html>
